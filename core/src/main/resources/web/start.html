<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>骗子酒馆 α版 · 开始</title>
<style>
  :root {
    --green: #4caf50;
    --accent: #74f109;
    --panel: #212f24;
    --bg: #0f1712;
    --line: rgba(255, 255, 255, 0.14);
    --ink: #eef6ee;
    --ink-dim: #a9bda9;
    --gold: #ffd166;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 0%, #1b2c20 0%, var(--bg) 70%);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    /* 放不下时必须能滚（手机字号被系统放大时救命） */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .wrap {
    max-width: 980px; margin: 0 auto; padding: 14px;
    display: flex; flex-direction: column; gap: 12px; min-height: 100%;
    justify-content: center;                /* 内容不多时整体居中，别顶在上面 */
    /* 挖孔屏横屏安全区；老 WebView 不支持 max() 时自动退回上面的 14px */
    padding-left: max(14px, env(safe-area-inset-left));
    padding-right: max(14px, env(safe-area-inset-right));
    padding-bottom: max(14px, env(safe-area-inset-bottom));
  }
  h1 { font-size: 20px; margin: 4px 0 0; letter-spacing: 2px; }
  h1 small { color: var(--ink-dim); font-size: 12px; letter-spacing: 1px; margin-left: 8px; }
  .sub { color: var(--ink-dim); font-size: 12px; margin: 0 0 4px; }
  /* 卡片按内容高度收缩（grid 同一行的两张卡片会自动等高），不要拉满整屏，
     否则 auto 外边距会把按钮顶到底部、中间空出一大块 */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 0 1 auto; align-items: stretch; }
  @media (max-height: 460px) { .cards { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 620px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .card h2 { font-size: 15px; margin: 0; color: var(--accent); }
  .card p { margin: 0; font-size: 12px; color: var(--ink-dim); line-height: 1.6; }
  /* ---- 左右两张卡片的元素要横向对齐，否则看着别扭 ----
     1) 说明文字统一占两行高度 → 下面的"地址框 / 输入框"对齐
     2) 地址框和输入框等高
     3) 按钮组用 auto 外边距贴到"底部说明"之上，底部说明也固定两行 → 绿色按钮一定齐平
     4) 卡片按内容收缩（.cards 不 flex:1），所以不会有中间空一大块的问题 */
  .card p { min-height: 3.2em; }
  .card .row { margin-top: auto; }
  .card p.tip { min-height: 3.2em; }
  .rooms:empty { display: none; }           /* 空列表不要占位，否则右边卡片会多出一个 gap */
  .url, input[type=text] { min-height: 42px; }
  .url {
    background: #16261b; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 10px; font-size: 14px; color: var(--gold); word-break: break-all;
  }
  input[type=text] {
    width: 100%; background: #16261b; border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 12px; color: var(--ink); font-size: 15px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  button {
    flex: 1; min-height: 46px; border-radius: 9px; border: 1px solid transparent;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .primary { background: var(--green); color: #08130a; }
  .primary:active { background: #3f9142; }
  .ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .ghost:active { border-color: var(--accent); color: var(--accent); }
  .rooms { display: flex; flex-direction: column; gap: 6px; }
  .room {
    display: flex; align-items: center; justify-content: space-between;
    background: #16261b; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 14px; cursor: pointer;
  }
  .room:active { border-color: var(--accent); }
  .room .meta { color: var(--ink-dim); font-size: 12px; }
  .muted { color: var(--ink-dim); font-size: 12px; }
  .tip { color: var(--ink-dim); font-size: 11px; line-height: 1.6; }
  .rules-link {
    color: var(--accent); text-decoration: none; margin-left: 10px;
    border: 1px solid rgba(116, 241, 9, .35); border-radius: 6px;
    padding: 1px 8px; font-size: 12px; white-space: nowrap;
  }
  .rules-link:active { background: rgba(116, 241, 9, .12); }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: rgba(0,0,0,.82); color: #fff; padding: 9px 16px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.on { opacity: 1; }

  /* ==================================================================
     手机横屏适配：真机横屏 CSS 视口只有 ~780x360，比模拟器小一半，
     所以这里按高度分档压缩（与 index.html 的 css/short.css 保持一致的思路）
     ================================================================== */
  @media (max-height: 460px) {
    .wrap { padding: 8px 10px; gap: 8px; }
    h1 { font-size: 16px; letter-spacing: 1px; }
    h1 small { font-size: 11px; }
    .sub { font-size: 11px; }
    .cards { gap: 8px; }
    .card { padding: 9px 10px; gap: 6px; border-radius: 10px; }
    .card h2 { font-size: 13px; }
    .card p { font-size: 11px; line-height: 1.45; min-height: 2.9em; }
    .card p.tip { min-height: 2.9em; }
    .url { font-size: 12px; padding: 6px 8px; }
    .url, input[type=text] { min-height: 34px; }
    input[type=text] { font-size: 13px; padding: 7px 9px; }
    button { min-height: 34px; font-size: 13px; }
    .tip { font-size: 10px; }
    .rules-link { font-size: 11px; padding: 0 6px; }
  }
  @media (max-height: 380px) {
    .wrap { padding: 6px 8px; gap: 6px; }
    h1 { font-size: 14px; }
    .sub { display: none; }
    .card { padding: 7px 9px; gap: 5px; }
    .card h2 { font-size: 12px; }
    .card p { font-size: 10.5px; }
    .url { font-size: 11px; padding: 5px 7px; }
    .url, input[type=text] { min-height: 30px; }
    input[type=text] { font-size: 12px; padding: 6px 8px; }
    button { min-height: 30px; font-size: 12px; }
  }
  @media (max-height: 330px) {
    .wrap { padding: 4px 6px; gap: 4px; }
    h1 { font-size: 13px; }
    .card p { display: none; }
    button { min-height: 27px; font-size: 11px; }
    .url, input[type=text] { min-height: 27px; }
  }
</style>
<script>
  /* 布局自检要盯的控件（见 js/uicheck.js） */
  window.UI_CHECK_SELECTORS = [
    ['.wrap', 'startWrap'],
    ['.card', 'startCard'],
    ['.card button', 'startBtn'],
    ['.rules-link', 'rulesLink'],
    ['input[type=text]', 'startInput'],
    ['.url', 'startUrl']
  ];
  /* 排障用：把视口尺寸打到 logcat（真机显示异常时，一看就知道是不是布局问题） */
  (function () {
    function report(tag) {
      try {
        console.log('[screen]' + (tag ? '(' + tag + ')' : '') +
          ' viewport=' + window.innerWidth + 'x' + window.innerHeight +
          ' dpr=' + (window.devicePixelRatio || 1) +
          ' screen=' + (window.screen ? window.screen.width + 'x' + window.screen.height : '?'));
      } catch (e) { /* 忽略 */ }
    }
    window.addEventListener('resize', function () { report('resize'); });
    window.addEventListener('orientationchange', function () { report('rotate'); });
    report('');
  })();
</script>
<script src="js/uicheck.js"></script>
</head>
<body>
<div class="wrap">
  <div>
    <h1>骗子酒馆 α版<small>Liar's Bar（魔改规则）</small></h1>
    <p class="sub">2~4 人 · 每轮 5 张牌 · 一把左轮六发一弹 · 支持机器人补齐人数
      <a class="rules-link" href="rules.html">📖 游戏规则</a>
    </p>
  </div>

  <div class="cards">
    <!-- ============ 创建房间 ============ -->
    <section class="card">
      <h2>① 我是主机（创建房间）</h2>
      <p>手机自己开服。把下面这个地址告诉朋友，他们用<b>同样的 App</b> 点「加入房间」填进去就行。</p>
      <div class="url" id="lan-url">检测中…</div>
      <div class="row">
        <button class="primary" id="enter-btn" type="button">进入牌桌</button>
        <button class="ghost" id="copy-btn" type="button">复制地址</button>
      </div>
      <p class="tip">只开主机不玩？房主也可以用「进入牌桌」后在大厅挂机，或让朋友先进。</p>
    </section>

    <!-- ============ 加入房间 ============ -->
    <section class="card">
      <h2>② 加入房间（朋友用这个）</h2>
      <p>填房主显示的地址（局域网 IP，可带端口；不带端口就默认 <span id="port-hint">8080</span>）。</p>
      <input type="text" id="host-input" placeholder="例如 192.168.1.5 或 192.168.1.5:8080"
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row">
        <button class="primary" id="join-btn" type="button">连接并进入</button>
        <button class="ghost" id="scan-btn" type="button">搜索附近房间</button>
      </div>
      <div class="rooms" id="room-list"></div>
      <p class="tip">同一 WiFi 才能直接连；异地联机请让房主用端口映射工具把端口开放出去。</p>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var D = {
    lanUrl: document.getElementById('lan-url'),
    copyBtn: document.getElementById('copy-btn'),
    enterBtn: document.getElementById('enter-btn'),
    hostInput: document.getElementById('host-input'),
    joinBtn: document.getElementById('join-btn'),
    scanBtn: document.getElementById('scan-btn'),
    roomList: document.getElementById('room-list'),
    portHint: document.getElementById('port-hint'),
    toast: document.getElementById('toast')
  };

  var PORT = location.port || '80';
  D.portHint.textContent = PORT;

  /* 记住上次填过的房主地址，省得每次都手输 */
  var LS_HOST = 'liarbar.host';
  function loadHost() {
    try { return localStorage.getItem(LS_HOST) || ''; } catch (e) { return ''; }
  }
  function saveHost(v) {
    try { localStorage.setItem(LS_HOST, v); } catch (e) { /* 隐私模式忽略 */ }
  }
  D.hostInput.value = loadHost();

  function toast(text) {
    D.toast.textContent = text;
    D.toast.classList.add('on');
    setTimeout(function () { D.toast.classList.remove('on'); }, 1800);
  }

  /* 本机入口：就是当前这个服务器的地址 */
  var JOIN_Q = /[?&]join=0/.test(location.search) ? '?join=0' : '';
  var selfOrigin = location.origin + '/';

  /* ?addr=example.com:29629 —— 直达某个房间（异地联机时把对外地址发给朋友，
     他们粘进「加入房间」即可；也可以用 ?addr=...&auto=join 全自动连过去） */
  var ADDR_Q = /[?&]addr=([^&]+)/.exec(location.search);
  if (ADDR_Q) {
    var direct = decodeURIComponent(ADDR_Q[1]);
    if (D.hostInput) D.hostInput.value = direct;
    saveHost(direct);
  }
  var AUTO_JOIN = /[?&]auto=join/.test(location.search);
  D.lanUrl.textContent = selfOrigin;

  /* 让原生侧把局域网地址填进来（浏览器打开时没有这个桥，就显示当前地址） */
  try {
    var bridge = window.LiarbarAndroid;
    if (bridge && typeof bridge.getLanUrl === 'function') {
      var lan = bridge.getLanUrl();
      if (lan) D.lanUrl.textContent = lan;
    }
  } catch (e) { /* 忽略 */ }

  function normalizeHost(v) {
    v = (v || '').trim();
    if (!v) return null;
    v = v.replace(/^https?:\/\//i, '').replace(/\/+$/, '');
    if (!/:\d+$/.test(v)) v = v + ':' + PORT;
    return 'http://' + v + '/';
  }

  D.enterBtn.onclick = function () {
    location.href = selfOrigin + JOIN_Q;
  };
  D.copyBtn.onclick = function () {
    var text = D.lanUrl.textContent || '';
    var done = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
        done = true;
      }
    } catch (e) { /* 忽略 */ }
    if (!done) {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done = true; } catch (e2) { /* 忽略 */ }
      document.body.removeChild(ta);
    }
    toast(done ? '地址已复制' : '请长按地址手动复制');
  };

  D.joinBtn.onclick = function () {
    var url = normalizeHost(D.hostInput.value);
    if (!url) { toast('请先填房主地址'); return; }
    saveHost(D.hostInput.value.trim());
    location.href = url;
  };

  D.hostInput.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') D.joinBtn.onclick();
  });

  function renderRooms(list) {
    D.roomList.innerHTML = '';
    if (!list || !list.length) {
      D.roomList.innerHTML = '<div class="muted">没搜到房间。确认和房主在同一 WiFi，' +
        '或直接手动填地址。</div>';
      return;
    }
    list.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'room';
      var phaseText = r.phase === 'lobby' ? '在大厅' : (r.phase === 'playing' ? '对局中' : '已结束');
      row.innerHTML = '<span>' + r.ip + ':' + r.port + '</span>' +
        '<span class="meta">' + r.players + ' 人 · ' + phaseText + '</span>';
      row.onclick = function () {
        saveHost(r.ip + ':' + r.port);
        location.href = 'http://' + r.ip + ':' + r.port + '/';
      };
      D.roomList.appendChild(row);
    });
  }

  D.scanBtn.onclick = function () {
    var bridge = window.LiarbarAndroid;
    if (!bridge || typeof bridge.scanRooms !== 'function') {
      D.roomList.innerHTML = '<div class="muted">自动搜索只在手机 App 里可用，' +
        '这里请手动填房主地址。</div>';
      return;
    }
    D.roomList.innerHTML = '<div class="muted">正在搜索附近房间…</div>';
    var raw = null;
    try { raw = bridge.scanRooms(); } catch (e) { raw = null; }
    var list = [];
    try { list = raw ? JSON.parse(raw) : []; } catch (e2) { list = []; }
    renderRooms(list);
  };

  /* ------------------------------------------------------------------
     ?auto=enter —— 开机自动进桌（手机专职当主机时少点两下）。
     故意等 8 秒：留出时间让服务端起来、朋友/机器人先入座，
     否则手机第一个进房就会变成房主，反而不好开局。
     ------------------------------------------------------------------ */
  if (/[?&]auto=enter/.test(location.search)) {
    setTimeout(function () {
      try {
        D.enterBtn.onclick();
      } catch (e) { /* 忽略 */ }
    }, 8000);
  }

  /* ------------------------------------------------------------------
     ?addr=xxx&auto=join —— 直达房间：填好地址后自动连过去。
     异地联机时，房主把对外地址发给朋友，朋友在「加入房间」粘一下就行；
     自动化测试也走这条路，不用依赖坐标点击。
     ------------------------------------------------------------------ */
  if (AUTO_JOIN && D.hostInput && D.hostInput.value) {
    setTimeout(function () {
      try {
        D.joinBtn.onclick();
      } catch (e) { /* 忽略 */ }
    }, 1200);
  }
})();
</script>
</body>
</html>
